version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@fullcalendar/core'
        versions:
          - '7.x'
      - dependency-name: '@fullcalendar/react'
        versions:
          - '7.x'
      - dependency-name: '@wagmi/core'
        versions:
          - '3.x'
      - dependency-name: 'wagmi'
        versions:
          - '3.x'
      - dependency-name: '@types/node'
        versions:
          - '26.x'
    groups:
      bun-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
